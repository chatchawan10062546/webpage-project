<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หลังบ้านแอดมิน - ปันกัน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
    <nav class="navbar navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="webpage.html">ปันกัน Admin</a>
            <button id="adminLogoutBtn" class="btn btn-outline-light btn-sm" type="button">ออกจากระบบ</button>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">ศูนย์จัดการระบบ</h1>
                <p class="text-muted mb-0">ตรวจสอบรายงานปัญหาจากผู้ใช้งาน</p>
            </div>
        </div>

        <section id="adminSummary" class="row g-3 mb-4"></section>
        <section class="admin-panel" id="adminViewReports">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 fw-bold mb-0">รายการแจ้งปัญหา</h2>
                <div class="d-flex gap-2"><select id="reportStatusFilter" class="form-select form-select-sm admin-filter"><option value="all">ทั้งหมด</option><option value="pending">รอตรวจสอบ</option><option value="resolved">แก้ไขแล้ว</option></select><button id="refreshReportsBtn" class="btn btn-outline-success btn-sm" type="button">รีเฟรช</button></div>
            </div>
            <div id="adminReportsList"></div>
        </section>
        <section class="admin-panel d-none" id="adminViewUsers"><div id="adminUsersList"></div></section>
        <section class="admin-panel d-none" id="adminViewItems"><div id="adminItemsList"></div></section>
        <section class="admin-panel d-none" id="adminViewTransactions"><div id="adminTransactionsList"></div></section>
    </main>

    <script src="js/authClient.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
