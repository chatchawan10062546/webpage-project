<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หลังบ้านแอดมิน - ปันสุข</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="webpage.html"><span class="admin-brand-mark"><i class="bi bi-shield-check"></i></span>ปันสุข <span class="admin-brand-label">ADMIN</span></a>
            <div class="d-flex align-items-center gap-3"><span class="admin-live-status"><span></span>ระบบทำงานปกติ</span><div class="dropdown"><button class="admin-user-chip" type="button" data-bs-toggle="dropdown" aria-expanded="false"><span class="admin-user-avatar"><i class="bi bi-person-fill"></i></span><span><strong id="adminUserName">ผู้ดูแลระบบ</strong><small id="adminUserEmail">admin</small></span><i class="bi bi-chevron-down admin-user-chevron"></i></button><ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 admin-account-menu"><li class="admin-account-heading"><span class="admin-account-icon"><i class="bi bi-shield-lock"></i></span><span><strong id="adminAccountName">ผู้ดูแลระบบ</strong><small id="adminAccountEmail">admin</small></span></li><li><div class="admin-account-role"><i class="bi bi-check-circle-fill"></i> สิทธิ์ผู้ดูแลระบบ</div></li><li><hr class="dropdown-divider"></li><li><button id="adminLogoutBtn" class="dropdown-item text-danger fw-bold" type="button"><i class="bi bi-box-arrow-right me-2"></i>ออกจากระบบ</button></li></ul></div></div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="admin-page-heading d-flex justify-content-between align-items-end mb-4">
            <div>
                <div class="admin-eyebrow">CONTROL CENTER <span></span></div>
                <h1 class="h3 fw-bold mb-1">ศูนย์จัดการระบบ</h1>
                <p class="text-muted mb-0">ภาพรวมการใช้งานและข้อมูลสำคัญของแพลตฟอร์ม</p>
            </div>
            <div class="admin-date-label"><i class="bi bi-calendar3"></i> <span id="adminDateLabel">วันนี้</span></div>
        </div>

        <section id="adminSummary" class="row g-3 mb-4"></section>
        <section class="admin-panel" id="adminViewReports">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 fw-bold mb-0">รายการแจ้งปัญหา</h2>
                <div class="d-flex gap-2"><select id="reportStatusFilter" class="form-select form-select-sm admin-filter"><option value="all">ทั้งหมด</option><option value="pending">รอตรวจสอบ</option><option value="resolved">แก้ไขแล้ว</option></select><button id="refreshReportsBtn" class="btn btn-outline-success btn-sm" type="button">รีเฟรช</button></div>
            </div>
            <div id="adminReportsList"></div>
        </section>
        <section class="admin-panel d-none" id="adminViewUsers"><div id="adminUsersList"></div></section>
        <section class="admin-panel d-none" id="adminViewItems"><div id="adminItemsList"></div></section>
        <section class="admin-panel d-none" id="adminViewPendingItems"><div id="adminPendingItemsList"></div></section>
        <section class="admin-panel d-none" id="adminViewTransactions"><div id="adminTransactionsList"></div></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/authClient.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
